variables:
- name: hs6
  table: product_market_latest
  type: string
  layer: source
  public: true
  definition: Zero-padded HS6 product code.
  source: CEPII BACI 202601 HS12.
- name: product_name
  table: product_market_latest
  type: string
  layer: source
  public: true
  definition: HS2012 product description from BACI metadata.
  source: CEPII BACI product metadata.
- name: destination_code
  table: product_market_latest
  type: integer
  layer: source
  public: true
  definition: BACI numeric importer code.
  source: CEPII BACI 202601.
- name: iso3
  table: product_market_latest
  type: string
  layer: source
  public: true
  definition: Three-letter economy code from BACI country metadata where available.
  source: CEPII BACI country metadata.
- name: destination_name
  table: product_market_latest
  type: string
  layer: source
  public: true
  definition: Importer economy name from BACI metadata.
  source: CEPII BACI metadata.
- name: destination_market_usd
  table: product_market_latest
  type: double
  layer: derived
  public: true
  definition: Total imports of the HS6 product by the destination from all suppliers.
  source: Derived from BACI bilateral flows.
- name: bd_exports_to_destination_usd
  table: product_market_latest
  type: double
  layer: derived
  public: true
  definition: Bangladesh exports of the HS6 product to the destination.
  source: Derived from BACI bilateral flows.
- name: bd_market_share
  table: product_market_latest
  type: double
  layer: manufactured
  public: true
  definition: Bangladesh exports divided by destination market imports for the HS6
    product.
  source: BEOED calculation from BACI.
- name: market_cagr_5y
  table: product_market_latest
  type: double
  layer: manufactured
  public: true
  definition: Five-year CAGR of destination imports of the HS6 product, where a valid
    base exists.
  source: BEOED calculation from BACI.
- name: supplier_hhi
  table: product_market_latest
  type: double
  layer: manufactured
  public: true
  definition: HHI of supplier shares in the destination-product market.
  source: BEOED calculation from BACI.
- name: top_supplier_share
  table: product_market_latest
  type: double
  layer: manufactured
  public: true
  definition: Share of the largest foreign supplier in the destination-product market.
  source: BEOED calculation from BACI.
- name: destination_familiarity
  table: product_market_latest
  type: double
  layer: manufactured
  public: true
  definition: Percentile-scaled measure of Bangladesh's total merchandise export relationship
    with the destination.
  source: BEOED calculation from BACI.
- name: product_experience
  table: product_market_latest
  type: double
  layer: manufactured
  public: true
  definition: Percentile-scaled measure of Bangladesh's global export scale and destination
    breadth in the HS6 product.
  source: BEOED calculation from BACI.
- name: market_attractiveness
  table: product_market_latest
  type: double
  layer: manufactured
  public: true
  definition: Transparent descriptive index combining market size, growth, and supplier
    openness; not an export-potential estimate.
  source: BEOED calculation.
- name: trade_familiarity_index
  table: product_market_latest
  type: double
  layer: manufactured
  public: true
  definition: Transparent descriptive index combining Bangladesh product export experience and destination familiarity. It is not a technical-readiness or production-capability measure.
  source: BEOED calculation.
- name: entry_probability_3y
  table: execution_private
  type: double
  layer: model
  public: false
  definition: Out-of-time calibrated probability that Bangladesh enters the product-destination
    market above the entry threshold within three years.
  source: BEOED model estimated on historical BACI transitions.
- name: persistence_probability_3y
  table: execution_private
  type: double
  layer: model
  public: false
  definition: Conditional probability that a newly entered product-destination relationship is active at the entry threshold three years later. Intervening years may be intermittent; this is persistence, not continuous survival.
  source: BEOED model estimated on historical BACI entries.
- name: durable_entry_score
  table: execution_private
  type: double
  layer: model
  public: false
  definition: Product of entry_probability_3y and persistence_probability_3y. This is a composite ranking score, not a fixed-horizon calibrated probability.
  source: BEOED calculation.
- name: diagnostic_flags
  table: execution_private
  type: string
  layer: manufactured
  public: false
  definition: Semicolon-separated observable warning flags such as declining market,
    high supplier concentration, low destination familiarity, or low product experience.
    These are diagnostics, not proven causal constraints.
  source: BEOED rules from observed variables.
- name: confidence_grade
  table: execution_private
  type: string
  layer: manufactured
  public: false
  definition: A/B/C grade based on data completeness, model support, and stability
    across alternative specifications.
  source: BEOED calculation.
- name: pci
  table: product_market_screening_v02
  type: double
  layer: manufactured
  public: true
  definition: Product Complexity Index derived internally from the latest BACI country-product RCA matrix.
  source: BEOED replication from BACI 202601; benchmark before external publication of exact ranks.
- name: density_bd
  table: product_market_screening_v02
  type: double
  layer: manufactured
  public: true
  definition: Product-space density around Bangladesh's current RCA>=1 export capabilities.
  source: BEOED calculation from BACI 202601 co-export proximity.
- name: rca_bd
  table: product_market_screening_v02
  type: double
  layer: manufactured
  public: true
  definition: Bangladesh Balassa revealed comparative advantage in the HS6 product in the latest year.
  source: BEOED calculation from BACI 202601.
- name: world_exports_usd
  table: product_market_screening_v02
  type: double
  layer: derived
  public: true
  definition: World exports of the HS6 product in the latest BACI year.
  source: Derived from BACI 202601.

- name: market_base_usd_5y
  table: product_market_latest
  type: double
  layer: derived
  public: true
  definition: Destination imports of the HS6 product five years before the latest year, used to assess growth reliability.
  source: Derived from BACI bilateral flows.
- name: market_growth_status
  table: product_market_latest
  type: string
  layer: manufactured
  public: true
  definition: Indicates whether the five-year growth calculation has a stable base (at least USD 1 million), a small base, or no observed base. Small/missing bases receive neutral growth contribution in market_attractiveness.
  source: BEOED rule.
- name: bd_product_exports_usd
  table: product_market_latest
  type: double
  layer: derived
  public: true
  definition: Bangladesh exports of the HS6 product to all destinations in the latest BACI year.
  source: Derived from BACI bilateral flows.
- name: bd_product_destinations
  table: product_market_latest
  type: integer
  layer: derived
  public: true
  definition: Number of destinations to which Bangladesh exports the HS6 product in the latest BACI year.
  source: Derived from BACI bilateral flows.
- name: capability_status
  table: product_market_screening_v02
  type: string
  layer: manufactured
  public: true
  definition: Transparent capability class separating established RCA, observed emerging exports, observed adjacency, latent product-space adjacency, and distant/unobserved products. Latent adjacency requires feasibility validation.
  source: BEOED rules from RCA, Bangladesh product exports, and product-space density.
- name: screening_class
  table: product_market_screening_v02
  type: string
  layer: manufactured
  public: true
  definition: Descriptive product-market screening class; explicitly not an investment recommendation or export-potential ranking.
  source: BEOED transparent rules.
- name: product_group
  table: product_market_screening_v02
  type: string
  layer: manufactured
  public: true
  definition: Coarse HS-chapter product group used to distinguish manufacturing adjacency from resource/endowment-dependent adjacency.
  source: BEOED HS-chapter mapping.
- name: complexity_upgrade_flag
  table: product_market_screening_v02
  type: boolean
  layer: manufactured
  public: true
  definition: Flags non-established manufacturing products with at least median PCI and observable/emergent or product-space-adjacent capability evidence. Requires further feasibility analysis.
  source: BEOED rules from PCI and capability status.
