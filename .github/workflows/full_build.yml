name: Full BEOED build
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 15 2 *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

      # BACI is a large annual source archive. CEPII can intermittently return
      # HTTP 403 to cloud-runner IPs, so restore/save an immutable per-release
      # cache and avoid redownloading it on every analytical rebuild.
      - name: Restore BACI 202601 cache
        id: baci-cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/BACI_HS12_V202601.zip
          key: baci-hs12-v202601

      - name: Fetch and validate BACI 202601 if cache is missing
        if: steps.baci-cache.outputs.cache-hit != 'true'
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from pathlib import Path
          from beod.download import BACI_URL, download_file
          p = Path('data/raw/BACI_HS12_V202601.zip')
          download_file(BACI_URL, p)
          print(f'BACI source ready: {p} ({p.stat().st_size:,} bytes)')
          PY

      - name: Save BACI 202601 cache
        if: steps.baci-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw/BACI_HS12_V202601.zip
          key: baci-hs12-v202601

      - name: Build v0.1 trade/execution core
        run: python scripts/build_all.py
      - name: Build v0.2 internally-derived complexity/product-space layer
        run: python scripts/build_v02.py
      - name: Build v0.3 public firm-capability seed and private candidate links
        run: python scripts/build_v03.py
      - name: Build v0.4 if documented priors have been supplied
        shell: bash
        run: |
          if [ -s data/external/value_capture_priors.csv ]; then
            python scripts/build_v04.py
          else
            echo 'v0.4 skipped: no documented value_capture_priors.csv supplied.'
          fi
      - name: Run release QA gate
        run: python scripts/run_qa.py
      - name: Write manifest
        run: python scripts/write_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: beoed-full-build-${{ github.run_number }}
          if-no-files-found: error
          path: |
            data/public/**
            data/derived/v02/**
            models/validation_report.json
            models/qa_report.json
            release_manifest.json
